<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRMS | Admin Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-page">

  <div class="dashboard-container">

    <!-- HEADER -->
    <header class="dashboard-header">
      <div>
        <div class="brand">SRMS</div>
        <h1>Admin Dashboard</h1>
        <p id="welcome"></p>
      </div>

    </header>


    <!-- DASHBOARD SECTIONS -->
    <main class="dashboard-grid">

      <!-- STUDENTS -->
      <section class="dashboard-card">
        <div class="card-header">
          <div class="card-icon">🎓</div>
          <div>
            <h2>Manage Students</h2>
            <p>Add or update student information</p>
          </div>
        </div>

        <div class="form-group">
          <label for="s_roll">Roll Number</label>
          <input id="s_roll" placeholder="Enter roll number">
        </div>

        <div class="form-group">
          <label for="s_name">Student Name</label>
          <input id="s_name" placeholder="Enter student name">
        </div>

        <div class="form-group">
          <label for="s_semester">Semester</label>
          <input id="s_semester" type="number" min="1" max="8" placeholder="Enter semester (1–8)">
        </div>

        <div class="form-group">
          <label for="s_year">Academic Year</label>
          <input id="s_year" placeholder="e.g. 2025-26">
        </div>

        <div class="button-group">
          <button onclick="addStudent()">Add Student</button>
          <button class="secondary-btn" onclick="editStudent()">Edit Student</button>
        </div>
      </section>


      <!-- SUBJECTS -->
      <section class="dashboard-card">
        <div class="card-header">
          <div class="card-icon">📚</div>
          <div>
            <h2>Manage Subjects</h2>
            <p>Add or update subjects</p>
          </div>
        </div>

        <div class="form-group">
          <label for="edit_subject">Select an existing subject to edit</label>
          <select id="edit_subject">
            <option value="">Select Subject</option>
          </select>
        </div>

        <div class="form-group">
          <label for="subject_name">Subject Name</label>
          <input id="subject_name" placeholder="Enter subject name">
        </div>

        <div class="button-group">
          <button onclick="addSubject()">Add Subject</button>
          <button class="secondary-btn" onclick="editSubject()">Edit Subject</button>
        </div>

      </section>


      <!-- MARKS -->
      <section class="dashboard-card">
        <div class="card-header">
          <div class="card-icon">📊</div>
          <div>
            <h2>Manage Marks</h2>
            <p>Add or update student marks</p>
          </div>
        </div>

        <div class="form-group">
          <label for="m_roll">Roll Number</label>
          <input id="m_roll" placeholder="Enter roll number">
        </div>

        <div class="form-group">
          <label for="m_subject">Subject</label>
          <select id="m_subject">
            <option value="">Select Subject</option>
          </select>
        </div>

        <div class="form-group">
          <label for="m_marks">Marks</label>
          <input id="m_marks" type="number" min="0" max="100" placeholder="Enter marks (0–100)">
        </div>

        <div class="button-group">
          <button onclick="addMarks()">Add Marks</button>
          <button class="secondary-btn" onclick="editMarks()">Edit Marks</button>
        </div>



      </section>

    </main>

  </div>

  <button class="logout-btn" onclick="logout()">Logout</button>

  <script src="js/admin_dashboard.js"></script>

</body>

</html>
